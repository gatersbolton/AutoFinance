<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ settings.app_name }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_prefix }}/static/style.css?v=proofread-highlight-20260512-1">
    <script>window.__APP_BASE_PATH__ = "{{ url_prefix }}";</script>
    <script defer src="{{ url_prefix }}/static/app.js?v=proofread-highlight-20260512-1"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="site-header">
        <div class="shell shell--header">
            <div>
                <a class="brand" href="{{ url_prefix }}/">财务报表数据提取</a>
            </div>
        </div>
    </header>
    <main class="shell">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
